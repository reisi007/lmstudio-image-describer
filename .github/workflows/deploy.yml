name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Build-Check für Dependabot-PRs: ohne diesen Trigger hätten sie keine
  # CI-Checks, auf die der Auto-Merge-Workflow warten könnte.
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    concurrency:
      group: build-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build
        env:
          BASE_PATH: /lmstudio-image-describer

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    # Nur echte Main-Pushes deployen - nie aus PR-Kontext heraus
    # (Environment github-pages + OIDC sind dort nicht verfügbar).
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: true
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
