name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Build-Check für Dependabot-PRs: ohne diesen Trigger hätten sie keine
  # CI-Checks, auf die der Auto-Merge-Workflow warten könnte.
  pull_request:
    branches: [main]
  # Auto-Merges passieren mit dem GITHUB_TOKEN - GitHub triggert daraus
  # absichtlich KEINE push-Workflows (Rekursionsschutz). Nach erfolgreichem
  # Auto-Merge-Run daher explizit den aktuellen main-Stand deployen.
  workflow_run:
    workflows: ["Dependabot Auto-Merge"]
    types: [completed]
  # Manueller Deploy (z.B. nach fehlgeschlagenem Pages-Run)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    concurrency:
      group: build-${{ github.ref }}
      cancel-in-progress: true
    steps:
      # Bei workflow_run zeigt github.sha auf den Merge-ref-SHA des
      # ausloesenden Runs - der Default-Branch (github.ref) ist die
      # verlaessliche Quelle und enthaelt den Merge-Commit bereits.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build
        env:
          BASE_PATH: /lmstudio-image-describer

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    # Nie aus PR-Kontext deployen (Environment github-pages + OIDC sind dort
    # nicht verfuegbar); workflow_run nur nach erfolgreichem Auto-Merge.
    if: >-
      github.event_name != 'pull_request' &&
      (github.event_name != 'workflow_run' ||
       github.event.workflow_run.conclusion == 'success')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: true
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
